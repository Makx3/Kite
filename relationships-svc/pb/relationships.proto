syntax = "proto3";

package relationships;

option go_package = "github.com/Makx3/Kite/relationships-svc/pb";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────
// Relationships administra el grafo de seguimiento: quién sigue
// a quién. Es la única fuente de verdad de esa relación; los
// user_id son referencias lógicas al servicio de Usuarios y NO
// se validan con claves foráneas (cada servicio es dueño de su
// propia base de datos).
// ─────────────────────────────────────────────────────────

// Follow representa una arista del grafo de seguimiento.
message Follow {
  string follower_id = 1; // usuario que sigue
  string followee_id = 2; // usuario seguido
  google.protobuf.Timestamp created_at = 3;
}

// ─ Mensajes de operación ─────────────────────────────────

message FollowUserRequest {
  string follower_id = 1;
  string followee_id = 2;
}

message FollowUserResponse {
  Follow follow = 1;
}

message UnfollowUserRequest {
  string follower_id = 1;
  string followee_id = 2;
}

message UnfollowUserResponse {
  // Sin cuerpo: el éxito se representa con un resultado OK vacío.
}

message GetFollowersRequest {
  string user_id = 1; // usuarios que siguen a user_id
  int32 limit = 2;    // 0 = valor por defecto del servicio
  int32 offset = 3;
}

message GetFollowersResponse {
  repeated string user_ids = 1;
  int32 total = 2; // total de seguidores, independiente de la página
}

message GetFollowingRequest {
  string user_id = 1; // usuarios a los que user_id sigue
  int32 limit = 2;
  int32 offset = 3;
}

message GetFollowingResponse {
  repeated string user_ids = 1;
  int32 total = 2;
}

// ─ Servicio ──────────────────────────────────────────────

service RelationshipService {
  rpc FollowUser (FollowUserRequest) returns (FollowUserResponse);
  rpc UnfollowUser (UnfollowUserRequest) returns (UnfollowUserResponse);
  rpc GetFollowers (GetFollowersRequest) returns (GetFollowersResponse);
  rpc GetFollowing (GetFollowingRequest) returns (GetFollowingResponse);
}
