# ─────────────────────────────────────────────────────────
# Kite — red social mínima
#
# Levanta el sistema completo con `docker compose up`:
#   * una base por servicio —PostgreSQL, MongoDB o Redis— con su propio
#     volumen. Cada servicio es dueño exclusivo de la suya: no se
#     comparte ninguna, ni la instancia ni las credenciales,
#   * los servicios de negocio Users, Relationships, Notifications,
#     Posts, Feed y Likes,
#   * el API Gateway, único punto de entrada HTTP del sistema.
#
# Aislamiento de red (requisito de la rúbrica): los servicios internos y
# las bases viven en la red `backend`, que es interna: no se publican
# puertos y no hay salida al exterior. Solo el API Gateway se conecta
# además a `frontend`, la única red publicada al host. Por eso ningún
# servicio de negocio es alcanzable desde fuera de Docker.
#
# Los valores van en `.env` (hay una copia de ejemplo comentada abajo).
# ─────────────────────────────────────────────────────────

name: kite

networks:
  # Red interna: servicios y bases. Sin puertos publicados ni internet.
  backend:
    internal: true
  # Red de borde: solo el API Gateway, publicada al host.
  frontend:

volumes:
  users_db_data:
  relationships_db_data:
  notifications_db_data:
  posts_db_data:
  likes_db_data:
  feed_db_data:

# Bloque común de las bases: misma imagen, reinicio y sonda de salud.
# Cada servicio declara luego su nombre de base y su volumen.
x-db-common: &db-common
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    # `$$` deja que el shell del contenedor lea sus propias variables.
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 12

# Igual que el anterior, para las dos bases MongoDB (Posts y Likes).
x-mongo-common: &mongo-common
  image: mongo:8
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" 2>/dev/null | grep 1 || mongo --eval \"db.adminCommand('ping').ok\" 2>/dev/null | grep 1"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  # ── Bases de datos ──────────────────────────────────────
  # Una instancia por servicio. Podrían compartir un solo motor con tres
  # bases, pero separarlas deja explícito quién es dueño de qué y aísla
  # el fallo: si una se cae, los otros servicios siguen operando.

  users-db:
    <<: *db-common
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: users_db
    volumes:
      - users_db_data:/var/lib/postgresql/data

  relationships-db:
    <<: *db-common
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relationships_db
    volumes:
      - relationships_db_data:/var/lib/postgresql/data

  notifications-db:
    <<: *db-common
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notifications_db
    volumes:
      - notifications_db_data:/var/lib/postgresql/data

  # `GLIBC_TUNABLES=glibc.pthread.rseq=1` es obligatorio en MongoDB 8.0+:
  # con kernels Linux de la serie 6.19 a 7.0.13 el mongod se niega a arrancar
  # por un conflicto de TCMalloc con el ABI de rseq (SERVER-121912), y ahí
  # `docker compose up` quedaría sin Posts ni Likes. Registrando rseq en glibc
  # el conflicto desaparece; en kernels sin ese problema no tiene efecto.
  # Debe ir en cada servicio: `<<` no fusiona los mapas `environment`.
  posts-db:
    <<: *mongo-common
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${POSTS_DB_USER:-kite}
      MONGO_INITDB_ROOT_PASSWORD: ${POSTS_DB_PASS:-kite123}
      MONGO_INITDB_DATABASE: posts_db
    volumes:
      - posts_db_data:/data/db

  likes-db:
    <<: *mongo-common
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${LIKES_DB_USER:-kite}
      MONGO_INITDB_ROOT_PASSWORD: ${LIKES_DB_PASS:-kite123}
      MONGO_INITDB_DATABASE: likes_db
    volumes:
      - likes_db_data:/data/db

  # Redis guarda los muros (feed). Sin autenticación: vive en la red
  # `backend`, que no se publica y no tiene salida al exterior.
  feed-db:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    volumes:
      - feed_db_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Servicios de negocio ────────────────────────────────
  # Ninguno publica puertos: se hablan solo por gRPC dentro de `backend`.
  # Cada uno aplica sus propias migraciones al arrancar y reintenta si la
  # base aún no está lista, por eso esperan a que su base esté sana.

  users-svc:
    build: ./users-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      USERS_GRPC_PORT: "50051"
      USERS_DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@users-db:5432/users_db?sslmode=disable
    depends_on:
      users-db:
        condition: service_healthy

  relationships-svc:
    build: ./relationships-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      RELATIONSHIPS_GRPC_PORT: "50052"
      RELATIONSHIPS_DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@relationships-db:5432/relationships_db?sslmode=disable
      # Disparador hacia Notifications: al crear una arista nueva.
      RELATIONSHIPS_NOTIFICATIONS_ADDR: notifications-svc:50053
    depends_on:
      relationships-db:
        condition: service_healthy
      notifications-svc:
        condition: service_started

  notifications-svc:
    build: ./notifications-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      NOTIFICATIONS_GRPC_PORT: "50053"
      NOTIFICATIONS_DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notifications-db:5432/notifications_db?sslmode=disable
    depends_on:
      notifications-db:
        condition: service_healthy

  posts-svc:
    build: ./posts-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTS_GRPC_PORT: "50054"
      POSTS_DB_DSN: mongodb://${POSTS_DB_USER:-kite}:${POSTS_DB_PASS:-kite123}@posts-db:27017/posts_db?authSource=admin
      POSTS_FEED_ADDR: feed-svc:50055
    depends_on:
      posts-db:
        condition: service_healthy
      feed-svc:
        condition: service_started

  feed-svc:
    build: ./feed-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      FEED_GRPC_PORT: "50055"
      FEED_DB_DSN: redis://feed-db:6379/0
      # El muro se reparte en el autor y su lista de seguidores.
      FEED_RELATIONSHIPS_ADDR: relationships-svc:50052
    depends_on:
      feed-db:
        condition: service_healthy
      relationships-svc:
        condition: service_started

  likes-svc:
    build: ./likes-svc
    restart: unless-stopped
    networks: [backend]
    environment:
      LIKES_GRPC_PORT: "50056"
      LIKES_DB_DSN: mongodb://${LIKES_DB_USER:-kite}:${LIKES_DB_PASS:-kite123}@likes-db:27017/likes_db?authSource=admin
      # Disparador hacia Notifications: al registrar un like nuevo.
      LIKES_NOTIFICATIONS_ADDR: notifications-svc:50053
    depends_on:
      likes-db:
        condition: service_healthy
      notifications-svc:
        condition: service_started

  # ── API Gateway ─────────────────────────────────────────
  # Único servicio con puerto publicado, y el único conectado a las dos
  # redes: recibe HTTP del host por `frontend` y habla gRPC por `backend`.

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    networks: [backend, frontend]
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    environment:
      GATEWAY_HTTP_PORT: "8080"
      GATEWAY_USERS_ADDR: users-svc:50051
      GATEWAY_RELATIONSHIPS_ADDR: relationships-svc:50052
      GATEWAY_NOTIFICATIONS_ADDR: notifications-svc:50053
      GATEWAY_POSTS_ADDR: posts-svc:50054
      GATEWAY_FEED_ADDR: feed-svc:50055
      GATEWAY_LIKES_ADDR: likes-svc:50056
    depends_on:
      users-svc:
        condition: service_started
      relationships-svc:
        condition: service_started
      notifications-svc:
        condition: service_started
      posts-svc:
        condition: service_started
      feed-svc:
        condition: service_started
      likes-svc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
