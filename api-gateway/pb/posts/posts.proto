syntax = "proto3";

package posts;

option go_package = "github.com/Makx3/Kite/api-gateway/pb/posts";

import "google/protobuf/timestamp.proto";

// Post representa una publicación en el sistema.
message Post {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Mensajes de operación
message CreatePostRequest {
  string user_id = 1;
  string content = 2;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message GetPostsByIdsRequest {
  repeated string post_ids = 1;
}

message GetPostsByIdsResponse {
  repeated Post posts = 1;
  repeated string missing = 2;
}

message GetPostsByUserRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetPostsByUserResponse {
  repeated Post posts = 1;
  int32 total = 2;
}

message DeletePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message DeletePostResponse {
  string status = 1;
}

// Servicio Posts
service PostService {
  rpc CreatePost (CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost (GetPostRequest) returns (GetPostResponse);
  rpc GetPostsByIds (GetPostsByIdsRequest) returns (GetPostsByIdsResponse);
  rpc GetPostsByUser (GetPostsByUserRequest) returns (GetPostsByUserResponse);
  rpc DeletePost (DeletePostRequest) returns (DeletePostResponse);
}
